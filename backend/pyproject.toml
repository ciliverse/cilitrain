[project]
name = "cilitrain"
version = "0.1.0"
description = "Open-source AI training on Kubernetes — cluster via CiliKube"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "sqlmodel>=0.0.24",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "kubernetes>=33.1.0",
  "httpx>=0.28.0",
  "python-multipart>=0.0.20",
  "PyJWT>=2.9.0",
  "bcrypt>=4.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
